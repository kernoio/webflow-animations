<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');

html, body { margin: 0; padding: 0; }
.kal-card, .kal-card * { box-sizing: border-box; }

.kal-card {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  margin: 0 auto;
  background: transparent;
  border-radius: 10px;
  overflow: hidden;
  font-family: 'JetBrains Mono','SF Mono','Fira Code',monospace;
  color: #c0d0dc;
  display: flex;
  flex-direction: column;
}

/* ── Top bar ── */
.kal-topbar {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.kal-brand { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #c0d0dc; }
.kal-brand-dot {
  width: 6px; height: 6px; border-radius: 50%; background: #ff00db;
  animation: kal-pulse 1.4s ease-in-out infinite;
}
@keyframes kal-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.65); } }
.kal-brand b { font-weight: 700; }
.kal-mcp {
  display: inline-flex; align-items: center; gap: 5px;
  border-radius: 20px;
  padding: 2px 9px;
  font-size: 8.5px; letter-spacing: .12em; color: rgba(255,255,255,.4);
}

/* ── Worktree tab ── */
.kal-tab-row { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 10px 14px 0; }
.kal-branch-icon { color: rgba(255,0,219,.6); font-size: 11px; }
.kal-tab-name { font-size: 10.5px; color: rgba(255,255,255,.4); letter-spacing: .02em; }

/* ── Step indicator ── */
.kal-steps { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 12px 14px 0; }
.kal-step {
  display: flex; align-items: center; gap: 6px;
  font-size: 9.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: rgba(255,255,255,.3);
  transition: color .35s ease;
  white-space: nowrap;
}
.kal-step-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  background: rgba(255,255,255,.15);
  transition: background-color .35s ease, box-shadow .35s ease;
}
.kal-step.active { color: #fff; }
.kal-step.active .kal-step-dot { background: #ff00db; box-shadow: 0 0 6px rgba(255,0,219,.65); }
.kal-step.done { color: rgba(255,255,255,.4); }
.kal-step.done .kal-step-dot { background: #48b86c; }
.kal-step-line { flex: 1; height: 1px; background: rgba(255,255,255,.08); transition: background-color .35s ease; }
.kal-step-line.done { background: rgba(72,184,108,.35); }

/* ── Body ── */
.kal-body { flex: 1; min-height: 0; padding: 12px 16px 16px; display: flex; flex-direction: column; }
.kal-file { flex-shrink: 0; font-size: 10.5px; color: rgba(255,255,255,.35); margin-bottom: 8px; }

.kal-panel { flex: 1; min-height: 0; position: relative; }
.kal-panel-inner {
  position: absolute; inset: 0;
  opacity: 0; transition: opacity .3s ease;
}
.kal-panel-inner.vis { opacity: 1; }

/* diff rows (write step) */
.kal-diff-row {
  font-size: 11px; line-height: 1.7; white-space: pre;
  opacity: 0; transform: translateY(3px);
  transition: opacity .3s ease, transform .3s ease;
}
.kal-diff-row.vis { opacity: 1; transform: none; }
.kal-ln-num { color: rgba(255,255,255,.22); margin-right: 8px; display: inline-block; min-width: 14px; }
.kal-ln-add { color: #48b86c; }
.kal-ln-rem { color: #f47067; }

/* validate step */
.kal-val-header {
  font-size: 9.5px; color: rgba(255,255,255,.32); letter-spacing: .08em; text-transform: uppercase;
  margin-bottom: 8px;
}
.kal-val-row {
  display: flex; align-items: baseline; gap: 8px; font-size: 11px; line-height: 1.85;
  opacity: 0; transform: translateY(3px); transition: opacity .3s ease, transform .3s ease;
}
.kal-val-row.vis { opacity: 1; transform: none; }
.kal-val-icon { flex-shrink: 0; color: #48b86c; }
.kal-val-desc { color: rgba(255,255,255,.55); }

/* pr step */
.kal-pr-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(72,184,108,.14); border: 1px solid rgba(72,184,108,.35);
  border-radius: 20px; padding: 3px 10px; font-size: 10px; font-weight: 600;
  color: #48b86c; margin-bottom: 10px;
}
.kal-pr-dot { width: 5px; height: 5px; border-radius: 50%; background: #48b86c; }
.kal-pr-title { font-size: 11.5px; color: #fff; font-weight: 600; margin-bottom: 6px; }
.kal-pr-branch { font-size: 10px; color: rgba(255,255,255,.4); line-height: 1.7; }
</style>

<div class="kal-card">
  <div class="kal-topbar">
    <div class="kal-brand"><span class="kal-brand-dot"></span><b>kerno</b> · agent loop</div>
    <div class="kal-mcp">MCP CONNECTED</div>
  </div>

  <div class="kal-tab-row">
    <span class="kal-branch-icon">⑂</span>
    <span class="kal-tab-name" id="kalTabName">agent/paginate-users</span>
  </div>

  <div class="kal-steps" id="kalSteps">
    <div class="kal-step" data-step="write"><span class="kal-step-dot"></span>Write</div>
    <div class="kal-step-line" data-line="1"></div>
    <div class="kal-step" data-step="validate"><span class="kal-step-dot"></span>Validate</div>
    <div class="kal-step-line" data-line="2"></div>
    <div class="kal-step" data-step="pr"><span class="kal-step-dot"></span>Open PR</div>
  </div>

  <div class="kal-body">
    <div class="kal-file" id="kalFile">api/users.ts</div>
    <div class="kal-panel" id="kalPanel"></div>
  </div>
</div>

<script>
(function(){
  var s = document.currentScript, root = s.previousElementSibling;
  while (root && !(root.classList && root.classList.contains('kal-card'))) root = root.previousElementSibling;
  if (!root) return;

  var $ = function(sel){ return root.querySelector(sel); };
  var tabName = $('#kalTabName');
  var fileEl  = $('#kalFile');
  var panel   = $('#kalPanel');
  var stepEls = Array.prototype.slice.call(root.querySelectorAll('.kal-step'));
  var lineEls = Array.prototype.slice.call(root.querySelectorAll('.kal-step-line'));

  var ORDER = ['write', 'validate', 'pr'];
  var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };

  function setStep(name){
    var idx = ORDER.indexOf(name);
    stepEls.forEach(function(el){
      var i = ORDER.indexOf(el.dataset.step);
      el.classList.toggle('active', i === idx);
      el.classList.toggle('done', i < idx);
    });
    lineEls.forEach(function(el){
      el.classList.toggle('done', parseInt(el.dataset.line, 10) <= idx);
    });
  }

  var SCENARIOS = [
    {
      tab: 'agent/paginate-users',
      file: 'api/users.ts',
      lines: [
        { num: '42', text: '- return users', cls: 'kal-ln-rem' },
        { num: '43', text: '+ const off = +req.query.offset', cls: 'kal-ln-add' },
        { num: '44', text: '+ return users.slice(off, off+20)', cls: 'kal-ln-add' }
      ],
      checks: [
        { desc: 'Returns paginated user list' },
        { desc: 'Empty result set returns []' },
        { desc: 'Response includes X-Total-Count' }
      ],
      pr: { num: '#2418', title: 'feat: paginate GET /api/users', branch: 'agent/paginate-users → main' }
    },
    {
      tab: 'agent/rate-limit-auth',
      file: 'auth/login.ts',
      lines: [
        { num: '18', text: '- return res.status(401)', cls: 'kal-ln-rem' },
        { num: '19', text: '+ if (attempts > 5)', cls: 'kal-ln-add' },
        { num: '20', text: '+   return res.status(429)', cls: 'kal-ln-add' }
      ],
      checks: [
        { desc: 'Valid credentials return a token' },
        { desc: 'Existing sessions unaffected' },
        { desc: 'Retry-After header present on 429' }
      ],
      pr: { num: '#1837', title: 'feat: rate limit auth/login', branch: 'agent/rate-limit-auth → main' }
    }
  ];

  async function swapPanel(buildFn){
    if (panel.firstChild){
      panel.firstChild.classList.remove('vis');
      await sleep(220);
    }
    panel.innerHTML = '';
    var inner = document.createElement('div');
    inner.className = 'kal-panel-inner';
    buildFn(inner);
    panel.appendChild(inner);
    await sleep(20);
    inner.classList.add('vis');
    return inner;
  }

  async function revealRows(rows, stagger){
    for (var i = 0; i < rows.length; i++){
      await sleep(stagger);
      rows[i].classList.add('vis');
    }
  }

  async function runScenario(sc){
    tabName.textContent = sc.tab;
    fileEl.textContent = sc.file;

    // ── Step 1: write ──
    setStep('write');
    var writeInner = await swapPanel(function(inner){
      sc.lines.forEach(function(l){
        var row = document.createElement('div');
        row.className = 'kal-diff-row';
        row.innerHTML = '<span class="kal-ln-num">' + l.num + '</span><span class="' + l.cls + '">' + l.text + '</span>';
        inner.appendChild(row);
      });
    });
    await revealRows(Array.prototype.slice.call(writeInner.children), 130);
    await sleep(1100);

    // ── Step 2: validate ──
    setStep('validate');
    var valInner = await swapPanel(function(inner){
      var header = document.createElement('div');
      header.className = 'kal-val-header';
      header.textContent = "Running in your agent's session";
      inner.appendChild(header);
      sc.checks.forEach(function(c){
        var row = document.createElement('div');
        row.className = 'kal-val-row';
        row.innerHTML = '<span class="kal-val-icon">&#10003;</span><span class="kal-val-desc">' + c.desc + '</span>';
        inner.appendChild(row);
      });
    });
    await revealRows(Array.prototype.slice.call(valInner.querySelectorAll('.kal-val-row')), 260);
    await sleep(900);

    // ── Step 3: open PR ──
    setStep('pr');
    await swapPanel(function(inner){
      inner.innerHTML =
        '<div class="kal-pr-badge"><span class="kal-pr-dot"></span>opened ' + sc.pr.num + '</div>' +
        '<div class="kal-pr-title">' + sc.pr.title + '</div>' +
        '<div class="kal-pr-branch">' + sc.pr.branch + '</div>';
    });
    await sleep(2600);

    // fade out before next scenario
    if (panel.firstChild) panel.firstChild.classList.remove('vis');
    stepEls.forEach(function(el){ el.classList.remove('active', 'done'); });
    lineEls.forEach(function(el){ el.classList.remove('done'); });
    await sleep(400);
  }

  async function mainLoop(){
    var idx = 0;
    while (true){
      await runScenario(SCENARIOS[idx]);
      idx = (idx + 1) % SCENARIOS.length;
    }
  }

  mainLoop();
})();
</script>
