<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');

html, body { margin: 0; padding: 0; }
.kal-card, .kal-card * { box-sizing: border-box; }

.kal-card {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  margin: 0 auto;
  background: transparent;
  border-radius: 10px;
  overflow: hidden;
  font-family: 'JetBrains Mono','SF Mono','Fira Code',monospace;
  color: #c0d0dc;
  display: flex;
  flex-direction: column;
  container-type: inline-size;
}

/* ── Top bar ── */
.kal-topbar {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.kal-brand { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #c0d0dc; }
.kal-brand-dot {
  width: 6px; height: 6px; border-radius: 50%; background: #ff00db;
  animation: kal-pulse 1.4s ease-in-out infinite;
}
@keyframes kal-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.65); } }
.kal-brand b { font-weight: 700; }
.kal-mcp {
  display: inline-flex; align-items: center; gap: 5px;
  border-radius: 20px;
  padding: 2px 9px;
  font-size: 8.5px; letter-spacing: .12em; color: rgba(255,255,255,.4);
}

/* ── Worktree tab ── */
.kal-tab-row { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 10px 14px 0; }
.kal-branch-icon { color: rgba(255,0,219,.6); font-size: 11px; }
.kal-tab-name { font-size: 10.5px; color: rgba(255,255,255,.4); letter-spacing: .02em; }

/* ── Body: write / validate / pr sections stack and stay once revealed ── */
.kal-body { flex: 1; min-height: 0; padding: 12px 16px 14px; display: flex; flex-direction: column; }

.kal-sec {
  flex-shrink: 0;
  opacity: 0; transform: translateY(4px);
  transition: opacity .35s ease, transform .35s ease;
}
.kal-sec.vis { opacity: 1; transform: none; }

.kal-file { font-size: 10.5px; color: rgba(255,255,255,.35); margin-bottom: 6px; }

.kal-diff-row {
  font-size: 11px; line-height: 1.5; white-space: pre;
  opacity: 0; transform: translateY(3px);
  transition: opacity .3s ease, transform .3s ease;
}
.kal-diff-row.vis { opacity: 1; transform: none; }
.kal-ln-num { color: rgba(255,255,255,.22); margin-right: 8px; display: inline-block; min-width: 14px; }
.kal-ln-add { color: #48b86c; }
.kal-ln-rem { color: #f47067; }

.kal-divider {
  flex-shrink: 0; height: 1px; background: rgba(255,255,255,.07);
  margin: 8px 0;
  opacity: 0; transition: opacity .35s ease;
}
.kal-divider.vis { opacity: 1; }

.kal-val-header {
  font-size: 9.5px; color: rgba(255,255,255,.32); letter-spacing: .08em; text-transform: uppercase;
  margin-bottom: 6px;
}
.kal-val-row {
  display: flex; align-items: baseline; gap: 8px; font-size: 11px; line-height: 1.55;
  opacity: 0; transform: translateY(3px); transition: opacity .3s ease, transform .3s ease;
}
.kal-val-row.vis { opacity: 1; transform: none; }
.kal-val-icon { flex-shrink: 0; color: #48b86c; }
.kal-val-desc { color: rgba(255,255,255,.55); }

.kal-pr-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(72,184,108,.14); border: 1px solid rgba(72,184,108,.35);
  border-radius: 20px; padding: 3px 10px; font-size: 10px; font-weight: 600;
  color: #48b86c; margin-bottom: 8px;
}
.kal-pr-dot { width: 5px; height: 5px; border-radius: 50%; background: #48b86c; }
.kal-pr-title { font-size: 11.5px; color: #fff; font-weight: 600; margin-bottom: 4px; }
.kal-pr-branch { font-size: 10px; color: rgba(255,255,255,.4); line-height: 1.5; }

/* ── Narrow card: tighten vertical rhythm so all three sections fit together ── */
@container (max-width: 400px) {
  .kal-topbar { padding: 9px 12px; }
  .kal-tab-row { padding: 6px 12px 0; }
  .kal-body { padding: 8px 14px 10px; }
  .kal-file { margin-bottom: 3px; }
  .kal-diff-row, .kal-val-row { line-height: 1.35; }
  .kal-divider { margin: 5px 0; }
  .kal-val-header { margin-bottom: 3px; }
  .kal-pr-badge { margin-bottom: 5px; }
  .kal-pr-title { margin-bottom: 2px; }
}
</style>

<div class="kal-card">
  <div class="kal-topbar">
    <div class="kal-brand"><span class="kal-brand-dot"></span><b>kerno</b> · agent loop</div>
    <div class="kal-mcp">MCP CONNECTED</div>
  </div>

  <div class="kal-tab-row">
    <span class="kal-branch-icon">⑂</span>
    <span class="kal-tab-name" id="kalTabName">agent/paginate-users</span>
  </div>

  <div class="kal-body">
    <div class="kal-sec" id="kalSecWrite">
      <div class="kal-file" id="kalFile"></div>
      <div id="kalDiff"></div>
    </div>

    <div class="kal-divider" id="kalDiv1"></div>

    <div class="kal-sec" id="kalSecValidate">
      <div class="kal-val-header">Running in your agent's session</div>
      <div id="kalChecks"></div>
    </div>

    <div class="kal-divider" id="kalDiv2"></div>

    <div class="kal-sec" id="kalSecPr"></div>
  </div>
</div>

<script>
(function(){
  var s = document.currentScript, root = s.previousElementSibling;
  while (root && !(root.classList && root.classList.contains('kal-card'))) root = root.previousElementSibling;
  if (!root) return;

  var $ = function(sel){ return root.querySelector(sel); };
  var tabName  = $('#kalTabName');
  var fileEl   = $('#kalFile');
  var diffEl   = $('#kalDiff');
  var checksEl = $('#kalChecks');
  var secWrite    = $('#kalSecWrite');
  var secValidate = $('#kalSecValidate');
  var secPr       = $('#kalSecPr');
  var div1 = $('#kalDiv1');
  var div2 = $('#kalDiv2');
  var body = $('.kal-body');

  var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };

  var SCENARIOS = [
    {
      tab: 'agent/paginate-users',
      file: 'api/users.ts',
      lines: [
        { num: '42', text: '- return users', cls: 'kal-ln-rem' },
        { num: '43', text: '+ const off = +req.query.offset', cls: 'kal-ln-add' },
        { num: '44', text: '+ return users.slice(off, off+20)', cls: 'kal-ln-add' }
      ],
      checks: [
        { desc: 'Returns paginated user list' },
        { desc: 'Empty result set returns []' },
        { desc: 'Response includes X-Total-Count' }
      ],
      pr: { num: '#2418', title: 'feat: paginate GET /api/users', branch: 'agent/paginate-users → main' }
    },
    {
      tab: 'agent/rate-limit-auth',
      file: 'auth/login.ts',
      lines: [
        { num: '18', text: '- return res.status(401)', cls: 'kal-ln-rem' },
        { num: '19', text: '+ if (attempts > 5)', cls: 'kal-ln-add' },
        { num: '20', text: '+   return res.status(429)', cls: 'kal-ln-add' }
      ],
      checks: [
        { desc: 'Valid credentials return a token' },
        { desc: 'Existing sessions unaffected' },
        { desc: 'Retry-After header present on 429' }
      ],
      pr: { num: '#1837', title: 'feat: rate limit auth/login', branch: 'agent/rate-limit-auth → main' }
    }
  ];

  async function revealRows(rows, stagger){
    for (var i = 0; i < rows.length; i++){
      await sleep(stagger);
      rows[i].classList.add('vis');
    }
  }

  function resetAll(){
    [secWrite, secValidate, secPr, div1, div2].forEach(function(el){ el.classList.remove('vis'); });
    diffEl.innerHTML = '';
    checksEl.innerHTML = '';
    secPr.innerHTML = '';
  }

  async function runScenario(sc){
    tabName.textContent = sc.tab;
    fileEl.textContent = sc.file;

    // ── write ──
    sc.lines.forEach(function(l){
      var row = document.createElement('div');
      row.className = 'kal-diff-row';
      row.innerHTML = '<span class="kal-ln-num">' + l.num + '</span><span class="' + l.cls + '">' + l.text + '</span>';
      diffEl.appendChild(row);
    });
    secWrite.classList.add('vis');
    await sleep(150);
    await revealRows(Array.prototype.slice.call(diffEl.children), 130);
    await sleep(700);

    // ── validate ──
    div1.classList.add('vis');
    sc.checks.forEach(function(c){
      var row = document.createElement('div');
      row.className = 'kal-val-row';
      row.innerHTML = '<span class="kal-val-icon">&#10003;</span><span class="kal-val-desc">' + c.desc + '</span>';
      checksEl.appendChild(row);
    });
    secValidate.classList.add('vis');
    await sleep(150);
    await revealRows(Array.prototype.slice.call(checksEl.querySelectorAll('.kal-val-row')), 220);
    await sleep(650);

    // ── open pr ──
    div2.classList.add('vis');
    secPr.innerHTML =
      '<div class="kal-pr-badge"><span class="kal-pr-dot"></span>opened ' + sc.pr.num + '</div>' +
      '<div class="kal-pr-title">' + sc.pr.title + '</div>' +
      '<div class="kal-pr-branch">' + sc.pr.branch + '</div>';
    await sleep(150);
    secPr.classList.add('vis');

    // whole flow visible together — hold, then fade out and loop
    await sleep(3200);
    body.style.transition = 'opacity .4s ease';
    body.style.opacity = '0';
    await sleep(400);
    resetAll();
    body.style.opacity = '1';
    await sleep(200);
  }

  async function mainLoop(){
    var idx = 0;
    while (true){
      await runScenario(SCENARIOS[idx]);
      idx = (idx + 1) % SCENARIOS.length;
    }
  }

  resetAll();
  mainLoop();
})();
</script>
